<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="960" viewBox="0 0 1460 960" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw request and tool routing</title>
  <desc id="desc">A user request can become a typed gateway call, a file tool, gateway or sandbox execution, node execution, or a typed node command.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker>
    <style>
      .title{font:700 30px Segoe UI,Arial,sans-serif;fill:#111}
      .box{font:16px Segoe UI,Arial,sans-serif;fill:#111;text-anchor:middle}
      .agent{font:18px Segoe UI,Arial,sans-serif;fill:#111;text-anchor:middle}
      .note{font:18px Segoe UI,Arial,sans-serif;fill:#111;text-anchor:middle}
    </style>
  </defs>
  <rect width="1460" height="960" fill="#fff"/>
  <text x="40" y="50" class="title">From user intent to the actual execution path</text>

  <rect x="60" y="140" width="230" height="110" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="175" y="180" class="agent"><tspan x="175">User intent</tspan><tspan x="175" dy="28">"delete this"</tspan></text>
  <rect x="390" y="125" width="310" height="140" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
  <text x="545" y="164" class="agent"><tspan x="545">Gateway agent runtime</tspan><tspan x="545" dy="25">model selects a tool, host,</tspan><tspan x="545" dy="25">target, and arguments</tspan></text>
  <path d="M290 195 H390" fill="none" stroke="#0078D4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="410" width="220" height="130" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="165" y="447" class="box"><tspan x="165">Typed gateway RPC</tspan><tspan x="165" dy="23">example:</tspan><tspan x="165" dy="23">sessions.delete</tspan></text>
  <rect x="325" y="410" width="220" height="130" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="435" y="447" class="box"><tspan x="435">Workspace/file tool</tspan><tspan x="435" dy="23">agent tool policy</tspan><tspan x="435" dy="23">and workspace policy</tspan></text>
  <rect x="595" y="410" width="220" height="130" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="705" y="447" class="box"><tspan x="705">exec host=gateway</tspan><tspan x="705" dy="23">gateway exec approval</tspan><tspan x="705" dy="23">runs on gateway host</tspan></text>
  <rect x="865" y="410" width="220" height="130" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="975" y="447" class="box"><tspan x="975">exec host=sandbox</tspan><tspan x="975" dy="23">agent sandbox backend</tspan><tspan x="975" dy="23">runs on sandbox host</tspan></text>
  <rect x="1135" y="390" width="270" height="170" rx="16" fill="#FDE7E9" stroke="#D13438" stroke-width="3"/>
  <text x="1270" y="425" class="box"><tspan x="1270">exec host=node</tspan><tspan x="1270" dy="23">select target node</tspan><tspan x="1270" dy="23">build platform shell argv</tspan><tspan x="1270" dy="23">approve and dispatch</tspan><tspan x="1270" dy="23">system.run</tspan></text>
  <rect x="600" y="680" width="310" height="125" rx="14" fill="#99E9F2" stroke="#0C8599" stroke-width="2"/>
  <text x="755" y="718" class="box"><tspan x="755">Purpose-built node command</tspan><tspan x="755" dy="23">node.invoke camera, screen,</tspan><tspan x="755" dy="23">canvas, notification, etc.</tspan></text>

  <path d="M500 265 L165 410" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520 265 L435 410" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 265 L705 410" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 265 L975 410" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M610 265 L1270 390" fill="none" stroke="#D13438" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 265 L755 680" fill="none" stroke="#0C8599" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="855" width="1260" height="65" rx="14" fill="#F3F2F1" stroke="#1e1e1e" stroke-width="2"/>
  <text x="730" y="883" class="note"><tspan x="730">The word "delete" is intent, not a route. Tool events must identify the actual tool, host,</tspan><tspan x="730" dy="24">target node, approvals, and execution mode.</tspan></text>
</svg>
